# ---------------------------------------------------------------------------
# Vessel — base compose definition
#
# This file defines the application and its single PostgreSQL instance. It is
# always combined with an environment-specific overlay:
#   development : docker-compose.dev.yml
#   self-hosted : docker-compose.selfhosted.yml
#   cloud       : docker-compose.cloud.yml
#
# PostgreSQL publishes no port here. Development adds one deliberately; the
# production overlays never do.
# ---------------------------------------------------------------------------

name: vessel

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vessel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in your env file}
      POSTGRES_DB: ${POSTGRES_DB:-vessel}
      # Modest defaults sized for a low-RAM home server.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vessel} -d ${POSTGRES_DB:-vessel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command:
      - postgres
      - -c
      - max_connections=40
      - -c
      - shared_buffers=128MB
      - -c
      - effective_cache_size=384MB
      - -c
      - work_mem=4MB
      - -c
      - maintenance_work_mem=64MB
      - -c
      - log_min_duration_statement=1000
    networks: [internal]

  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-vessel}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-vessel}
      APP_URL: ${APP_URL:?set APP_URL}
      APP_NAME: ${APP_NAME:-Vessel}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-vessel_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      MEDIA_ROOT: /srv/vessel/media
      MEDIA_PUBLIC_PREFIX: /api/media
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-12}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_PUBLIC_BASE_URL: ${S3_PUBLIC_BASE_URL:-}
      MAIL_DRIVER: ${MAIL_DRIVER:-console}
      MAIL_FROM: ${MAIL_FROM:-Vessel <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      FEATURE_BILLING: ${FEATURE_BILLING:-false}
      FEATURE_INTEGRATIONS: ${FEATURE_INTEGRATIONS:-false}
    volumes:
      - media_data:/srv/vessel/media
    networks: [internal]
    # Bound to loopback only: the tunnel (or a local reverse proxy) is the only
    # thing that should reach the app in production.
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          # Serialises on a 4 GB host with room to spare.
          memory: ${WEB_MEMORY_LIMIT:-768M}

volumes:
  db_data:
  media_data:

networks:
  internal:
    driver: bridge
