# ---------------------------------------------------------------------------
# null — development overlay
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up
#
# Differences from production: source is bind-mounted with hot reload, the
# database port is published to localhost for psql/GUI tools, and the app runs
# `next dev` instead of the compiled server.
# ---------------------------------------------------------------------------

services:
  db:
    ports:
      # Localhost only — never 0.0.0.0.
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  web:
    build:
      target: deps
    image: null-dev
    command: npm run dev
    working_dir: /app
    user: node
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://${POSTGRES_USER:-null}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-null}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - ./.next:/app/.next
      - media_data:/srv/null/media
    ports:
      - "0.0.0.0:${WEB_PORT:-3000}:3000"

volumes:
  node_modules:
